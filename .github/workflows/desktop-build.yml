name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-desktop.mjs ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Imageboard-${{ matrix.target }}
          path: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.zip
          if-no-files-found: error
